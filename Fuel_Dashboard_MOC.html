<!DOCTYPE html>
<html lang="km"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuel Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head><body class="bg-light">
<div class="container py-4">
<h2>⛽ Fuel Price Dashboard (MOC)</h2>
<p class="text-muted">ត្រូវបើកតាម Web Server (XAMPP/IIS/Live Server) ប្រសិនបើជួប CORS។</p>
<button class="btn btn-primary mb-3" onclick="loadFuel()">Refresh</button>
<div class="row g-3">
<div class="col"><div class="card"><div class="card-body"><h5>ប្រេងសាំង</h5><h3 id="g">-</h3><small id="gd"></small></div></div></div>
<div class="col"><div class="card"><div class="card-body"><h5>ប្រេងម៉ាស៊ូត</h5><h3 id="d">-</h3><small id="dd"></small></div></div></div>
<div class="col"><div class="card"><div class="card-body"><h5>ប្រេងកាត</h5><h3 id="k">-</h3><small id="kd"></small></div></div></div>
</div>
<canvas id="c" class="mt-4"></canvas>
</div>
<script>
let chart;
function iso(x){return x.toISOString().slice(0,10)}
async function loadFuel(){
const e=new Date(),s=new Date();s.setDate(e.getDate()-30);
const q=`query publicCommodityPriceLineReport($commodityPriceLineReportFilter: CommodityPriceDetailLineReportFilter!) {
 publicCommodityPriceLineReport(reportLineFilter:$commodityPriceLineReportFilter){
 items{id data{x y}}
 }}`;
const body={operationName:"publicCommodityPriceLineReport",query:q,variables:{commodityPriceLineReportFilter:{byProvince:1,byProduct:[107,108,109],startDate:iso(s),endDate:iso(e)}}};
const r=await fetch("https://sas-graphql.moc.gov.kh/graphql",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
const j=await r.json();
const items=j.data.publicCommodityPriceLineReport.items;
let labels=[],sets=[];
for(const it of items){
 const last=it.data.at(-1);
 if(it.id.includes("សាំង")){g.innerText=last.y+" ៛";gd.innerText=last.x;}
 if(it.id.includes("ម៉ាស៊ូត")){d.innerText=last.y+" ៛";dd.innerText=last.x;}
 if(it.id.includes("កាត")){k.innerText=last.y+" ៛";kd.innerText=last.x;}
 labels=it.data.map(x=>x.x);
 sets.push({label:it.id,data:it.data.map(x=>+x.y)});
}
if(chart)chart.destroy();
chart=new Chart(c,{type:"line",data:{labels:labels,datasets:sets}});
}
loadFuel().catch(console.error);
</script></body></html>
